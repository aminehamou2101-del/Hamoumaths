<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>الملف الشخصي | HAMOU MATH</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>
        .profile-page {
            width: min(1000px, 94%);
            margin: 40px auto 80px;
        }

        .profile-hero {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: white;
            color: #1565c0;
            display: grid;
            place-items: center;
            margin: 0 auto 15px;
            font-size: 38px;
            font-weight: bold;
        }

        .profile-hero h1 {
            margin: 10px 0;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-top: 25px;
        }

        .profile-stat {
            background: white;
            border-radius: 20px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,.07);
        }

        .profile-stat strong {
            display: block;
            font-size: 30px;
            color: #1565c0;
            margin-top: 8px;
        }

        .profile-section {
            background: white;
            border-radius: 25px;
            padding: 25px;
            margin-top: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,.06);
        }

        .progress {
            height: 14px;
            background: #e8eef7;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #1565c0, #00bcd4);
            transition: width .4s ease;
        }

        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .badge {
            background: #fffaf0;
            border: 1px solid #f1e2b5;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }

        .badge-icon {
            font-size: 42px;
        }

        .badge small {
            display: block;
            color: #78909c;
            margin-top: 5px;
        }

        @media (max-width: 750px) {
            .profile-stats {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 450px) {
            .profile-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

<header class="navbar">

    <div class="brand">
        <a href="../index.html">
            🧮 HAMOU MATH
        </a>
    </div>

    <nav>
        <a href="../index.html">الرئيسية</a>
        <a href="dashboard.html">لوحتي</a>
        <a href="leaderboard.html">🏆 الترتيب</a>
        <a href="achievements.html">🎖️ الإنجازات</a>
    </nav>

</header>


<main class="profile-page">

    <section class="profile-hero">

        <div
            id="profileAvatar"
            class="profile-avatar"
        >
            م
        </div>

        <h1 id="profileName">
            جارٍ التحميل...
        </h1>

        <p id="profileRole">
            طالب
        </p>

    </section>


    <section class="profile-stats">

        <div class="profile-stat">
            ⭐
            <div>XP</div>
            <strong id="profileXP">0</strong>
        </div>

        <div class="profile-stat">
            🏆
            <div>المستوى</div>
            <strong id="profileLevel">1</strong>
        </div>

        <div class="profile-stat">
            📝
            <div>التمارين</div>
            <strong id="profileExercises">0</strong>
        </div>

        <div class="profile-stat">
            📈
            <div>النجاح</div>
            <strong id="profileSuccess">0%</strong>
        </div>

    </section>


    <section class="profile-section">

        <h2>📊 التقدم إلى المستوى التالي</h2>

        <p id="levelProgressText">
            جارٍ الحساب...
        </p>

        <div class="progress">
            <div
                id="levelProgressBar"
                class="progress-bar"
            ></div>
        </div>

    </section>


    <section class="profile-section">

        <h2>🏅 الشارات المكتسبة</h2>

        <div
            id="profileBadges"
            class="badges-grid"
        >
            جارٍ التحميل...
        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="../js/profile.js"></script>

</body>
</html>
