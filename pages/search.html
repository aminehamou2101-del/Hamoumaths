<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>البحث المتقدم | HAMOU MATH</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

<div id="hamou-navbar"></div>

<main class="search-page">

    <section class="search-hero">

        <h1>🔎 البحث المتقدم</h1>

        <p>
            ابحث في المكتبة والدروس والتمارين.
        </p>

        <div class="search-form">

            <input
                id="searchInput"
                type="search"
                placeholder="اكتب كلمة البحث..."
                autocomplete="off"
            >

            <select id="searchType">
                <option value="all">كل المحتوى</option>
                <option value="resource">الكتب والموارد</option>
                <option value="lesson">الدروس</option>
                <option value="exercise">التمارين</option>
            </select>

            <select id="searchLevel">
                <option value="">كل المستويات</option>
                <option value="متوسط">متوسط</option>
                <option value="1 ثانوي">1 ثانوي</option>
                <option value="2 ثانوي">2 ثانوي</option>
                <option value="3 ثانوي">3 ثانوي</option>
                <option value="بكالوريا">بكالوريا</option>
            </select>

            <input
                id="searchSubject"
                placeholder="المادة"
            >

            <input
                id="searchUnit"
                placeholder="الوحدة / المحور"
            >

            <select id="searchDifficulty">
                <option value="">كل الصعوبات</option>
                <option value="easy">سهل</option>
                <option value="medium">متوسط</option>
                <option value="hard">صعب</option>
            </select>

            <button
                id="searchButton"
                type="button"
            >
                بحث
            </button>

        </div>

    </section>


    <section class="search-results-section">

        <div id="searchStatus">
            اكتب كلمة أو استخدم الفلاتر.
        </div>

        <div
            id="searchResults"
            class="search-results"
        ></div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="../js/theme.js"></script>

<script src="../js/navbar.js"></script>

<script src="../js/search.js"></script>
<input
    id="searchTopic"
    placeholder="الموضوع"
/>
</body>
</html>
