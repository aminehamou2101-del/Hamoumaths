<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
تعيين كلمة المرور | HAMOU MATH
</title>

<style>

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: #f4f8ff;

    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

.card {

    width:
        min(430px, 100%);

    background:
        white;

    border:
        1px solid #dbe5f1;

    border-radius:
        22px;

    padding:
        28px;

    box-shadow:
        0 20px 60px
        rgba(8,43,92,.11);
}

h1 {

    color:
        #082b5c;

    text-align:
        center;
}

label {

    display:
        block;

    margin:
        15px 0 7px;

    font-weight:
        800;
}

input {

    width:
        100%;

    box-sizing:
        border-box;

    padding:
        13px;

    border:
        1px solid #dbe5f1;

    border-radius:
        12px;

    font:
        inherit;
}

button {

    width:
        100%;

    margin-top:
        18px;

    padding:
        13px;

    border:
        0;

    border-radius:
        12px;

    color:
        white;

    background:
        #1565c0;

    font:
        inherit;

    font-weight:
        900;

    cursor:
        pointer;
}

.message {

    display:
        none;

    margin-top:
        14px;

    padding:
        11px;

    border-radius:
        10px;

    font-size:
        13px;
}

.show {
    display: block;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}

</style>

</head>

<body>

<section class="card">

<h1>
🔐 كلمة مرور جديدة
</h1>

<form id="form">

<label for="password">
كلمة المرور الجديدة
</label>

<input
    id="password"
    type="password"
    minlength="8"
    required
    placeholder="8 أحرف على الأقل"
>

<label for="confirm">
تأكيد كلمة المرور
</label>

<input
    id="confirm"
    type="password"
    minlength="8"
    required
    placeholder="أعد كتابة كلمة المرور"
>

<button
    type="submit"
    id="button"
>
حفظ كلمة المرور
</button>

<div
    id="message"
    class="message"
></div>

</form>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script>

(function () {

    "use strict";

    const form =
        document.getElementById(
            "form"
        );

    const password =
        document.getElementById(
            "password"
        );

    const confirm =
        document.getElementById(
            "confirm"
        );

    const button =
        document.getElementById(
            "button"
        );

    const message =
        document.getElementById(
            "message"
        );

    function show(
        text,
        success
    ) {

        message.textContent =
            text;

        message.className =
            `message show ${
                success
                    ? "success"
                    : "error"
            }`;
    }

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            if (
                password.value.length < 8
            ) {

                show(
                    "كلمة المرور يجب أن تكون 8 أحرف على الأقل.",
                    false
                );

                return;
            }

            if (
                password.value !==
                confirm.value
            ) {

                show(
                    "كلمتا المرور غير متطابقتين.",
                    false
                );

                return;
            }

            button.disabled = true;

            button.textContent =
                "جارِ الحفظ...";

            try {

                const {
                    error
                } =
                    await supabaseClient
                        .auth
                        .updateUser({
                            password:
                                password.value
                        });

                if (error) {
                    throw error;
                }

                show(
                    "تم تغيير كلمة المرور بنجاح.",
                    true
                );

                setTimeout(
                    () => {
                        location.href =
                            "login.html";
                    },
                    1200
                );

            } catch (error) {

                console.error(error);

                show(
                    "تعذر تغيير كلمة المرور: " +
                    error.message,
                    false
                );

                button.disabled = false;

                button.textContent =
                    "حفظ كلمة المرور";
            }

        }
    );

})();

</script>

</body>
</html>
