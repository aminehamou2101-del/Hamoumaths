<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="تسجيل الدخول إلى منصة HAMOU MATH"
    >

    <title>تسجيل الدخول | HAMOU MATH</title>

    <link
        rel="icon"
        href="../assets/logo.svg"
    >

    <style>
        :root {
            --primary: #1565c0;
            --primary-dark: #0d47a1;
            --secondary: #00bcd4;
            --dark: #082b5c;
            --bg: #f4f8ff;
            --card: #ffffff;
            --text: #172033;
            --muted: #64748b;
            --border: #dbe5f1;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at top right,
                    rgba(0, 188, 212, .12),
                    transparent 28%
                ),
                linear-gradient(
                    180deg,
                    #f8fbff,
                    var(--bg)
                );
        }

        .page {
            min-height:
                calc(100vh - 70px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 35px 15px;
        }

        .card {
            width: min(460px, 100%);

            background: var(--card);

            border:
                1px solid
                var(--border);

            border-radius: 25px;

            padding: 32px;

            box-shadow:
                0 25px 70px
                rgba(8, 43, 92, .12);
        }

        .brand {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 10px;

            margin-bottom: 25px;

            color: var(--dark);

            font-size: 21px;
            font-weight: 900;
        }

        .logo {
            width: 50px;
            height: 50px;

            display: grid;
            place-items: center;

            border-radius: 15px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--dark),
                    var(--primary),
                    var(--secondary)
                );

            box-shadow:
                0 10px 25px
                rgba(21, 101, 192, .22);
        }

        h1 {
            margin:
                0 0 8px;

            text-align: center;

            color: var(--dark);

            font-size: 28px;
        }

        .subtitle {
            margin:
                0 0 25px;

            color: var(--muted);

            text-align: center;

            font-size: 13px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: var(--dark);

            font-size: 13px;

            font-weight: 800;
        }

        .password-wrap {
            position: relative;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            background: white;

            color: var(--text);

            font: inherit;

            outline: none;

            transition: .18s ease;
        }

        input:focus {
            border-color:
                var(--primary);

            box-shadow:
                0 0 0 4px
                rgba(21, 101, 192, .09);
        }

        .password-wrap input {
            padding-left: 50px;
        }

        .toggle-password {
            position: absolute;

            left: 8px;
            top: 50%;

            transform:
                translateY(-50%);

            width: 36px;
            height: 36px;

            border: 0;
            border-radius: 10px;

            background: transparent;

            cursor: pointer;

            font-size: 18px;
        }

        .button {
            width: 100%;

            padding: 13px;

            border: 0;
            border-radius: 12px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-dark)
                );

            font: inherit;

            font-weight: 900;

            cursor: pointer;

            transition: .18s ease;
        }

        .button:hover {
            transform:
                translateY(-1px);
        }

        .button:disabled {
            opacity: .65;
            cursor: wait;
        }

        .message {
            display: none;

            margin-top: 14px;

            padding: 12px 13px;

            border-radius: 11px;

            font-size: 13px;

            line-height: 1.7;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background:
                var(--success-bg);

            color:
                var(--success-text);
        }

        .message.error {
            background:
                var(--error-bg);

            color:
                var(--error-text);
        }

        .links {
            display: flex;

            justify-content:
                space-between;

            gap: 12px;

            margin-top: 18px;

            font-size: 13px;
        }

        .links a {
            color:
                var(--primary);

            font-weight:
                800;
        }

        .security {
            margin-top: 22px;

            padding: 11px;

            border-radius: 11px;

            background: #f8fbff;

            color: var(--muted);

            text-align: center;

            font-size: 11px;
        }

        @media (max-width: 500px) {
            .card {
                padding:
                    24px 18px;

                border-radius:
                    20px;
            }

            h1 {
                font-size: 24px;
            }

            .links {
                flex-direction:
                    column;

                text-align: center;
            }
        }
    </style>
</head>

<body>

<div id="hamou-navbar"></div>

<main class="page">

    <section class="card">

        <div class="brand">

            <div class="logo">
                ∑
            </div>

            <span>
                HAMOU MATH
            </span>

        </div>

        <h1>
            🔐 تسجيل الدخول
        </h1>

        <p class="subtitle">
            ادخل إلى حسابك وتابع مسارك التعليمي.
        </p>

        <form id="loginForm" novalidate>

            <div class="field">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    maxlength="255"
                    required
                    placeholder="example@email.com"
                >

            </div>

            <div class="field">

                <label for="password">
                    كلمة المرور
                </label>

                <div class="password-wrap">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        minlength="8"
                        required
                        placeholder="كلمة المرور"
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="إظهار كلمة المرور"
                    >
                        👁️
                    </button>

                </div>

            </div>

            <button
                id="loginButton"
                class="button"
                type="submit"
            >
                دخول
            </button>

            <div
                id="message"
                class="message"
                role="alert"
            ></div>

        </form>

        <div class="links">

            <a href="register.html">
                إنشاء حساب جديد
            </a>

            <a href="forgot-password.html">
                نسيت كلمة المرور؟
            </a>

        </div>

        <div class="security">
            🔒 المصادقة والحسابات تتم عبر Supabase Auth.
        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/navbar.js"></script>

<script>
(function () {

    "use strict";

    const form =
        document.getElementById("loginForm");

    const email =
        document.getElementById("email");

    const password =
        document.getElementById("password");

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");

    const toggle =
        document.getElementById("togglePassword");

    function showMessage(
        text,
        success = false
    ) {
        message.textContent = text;

        message.className =
            `message show ${
                success
                    ? "success"
                    : "error"
            }`;
    }

    toggle.addEventListener(
        "click",
        function () {

            const visible =
                password.type === "text";

            password.type =
                visible
                    ? "password"
                    : "text";

            toggle.textContent =
                visible
                    ? "👁️"
                    : "🙈";
        }
    );

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const emailValue =
                email.value
                    .trim()
                    .toLowerCase();

            const passwordValue =
                password.value;

            if (!emailValue) {
                showMessage(
                    "أدخل البريد الإلكتروني."
                );
                return;
            }

            if (!passwordValue) {
                showMessage(
                    "أدخل كلمة المرور."
                );
                return;
            }

            button.disabled = true;

            button.textContent =
                "جارِ تسجيل الدخول...";

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({
                            email:
                                emailValue,

                            password:
                                passwordValue
                        });

                if (error) {
                    throw error;
                }

                if (!data?.user) {
                    throw new Error(
                        "تعذر إنشاء جلسة الدخول."
                    );
                }

                showMessage(
                    "تم تسجيل الدخول بنجاح.",
                    true
                );

                const redirect =
                    new URLSearchParams(
                        window.location.search
                    ).get("redirect");

                const target =
                    redirect &&
                    redirect.startsWith("/")
                        ? redirect
                        : "dashboard.html";

                setTimeout(
                    function () {
                        window.location.href =
                            target;
                    },
                    500
                );

            } catch (error) {

                console.error(
                    "HAMOU MATH login:",
                    error
                );

                const text =
                    String(
                        error?.message || ""
                    ).toLowerCase();

                if (
                    text.includes(
                        "invalid login credentials"
                    )
                ) {

                    showMessage(
                        "البريد الإلكتروني أو كلمة المرور غير صحيحة."
                    );

                } else if (
                    text.includes(
                        "email not confirmed"
                    )
                ) {

                    showMessage(
                        "يجب تأكيد البريد الإلكتروني أولًا."
                    );

                } else if (
                    text.includes(
                        "invalid api key"
                    )
                ) {

                    showMessage(
                        "مفتاح Supabase غير صالح. تحقق من js/supabase.js."
                    );

                } else {

                    showMessage(
                        "تعذر تسجيل الدخول: " +
                        (
                            error?.message ||
                            "خطأ غير معروف"
                        )
                    );
                }

                button.disabled = false;

                button.textContent =
                    "دخول";
            }
        }
    );

})();
</script>

</body>
</html>
