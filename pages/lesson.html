<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>الدرس | HAMOU MATH</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .lesson-page {
            width: min(1000px, 94%);
            margin: 35px auto 80px;
        }

        .lesson-header {
            background:
                linear-gradient(
                    135deg,
                    #0d47a1,
                    #1565c0
                );

            color: white;

            border-radius: 28px;

            padding: 40px;

            margin-bottom: 25px;
        }

        .lesson-header h1 {
            margin: 10px 0;
            font-size: 38px;
        }

        .lesson-content {
            background: var(--surface, #fff);
            color: var(--text, #222);

            border-radius: 24px;

            padding: 35px;

            box-shadow:
                0 10px 30px rgba(0,0,0,.07);

            line-height: 2;

            font-size: 18px;
        }

        .lesson-content h2,
        .lesson-content h3 {
            color: #1565c0;
        }

        .lesson-video {
            margin-top: 25px;
        }

        .lesson-video iframe {
            width: 100%;
            min-height: 450px;
            border: 0;
            border-radius: 20px;
        }

        .lesson-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .lesson-btn {
            display: inline-block;

            padding: 12px 20px;

            border-radius: 12px;

            text-decoration: none;

            background: #1565c0;

            color: white;
        }

        .related-exercises {
            margin-top: 25px;
        }

        .exercise-card {
            background: var(--surface-soft, #f7f9fc);

            border: 1px solid #e4eaf2;

            padding: 18px;

            border-radius: 16px;

            margin-top: 12px;
        }

        .status {
            margin-bottom: 20px;
            color: var(--muted, #607d8b);
        }

        @media (max-width: 700px) {

            .lesson-header {
                padding: 30px 20px;
            }

            .lesson-header h1 {
                font-size: 30px;
            }

            .lesson-content {
                padding: 22px;
            }

            .lesson-video iframe {
                min-height: 250px;
            }
        }

    </style>

</head>


<body>

<div id="hamou-navbar"></div>


<main class="lesson-page">

    <div
        id="status"
        class="status"
    >
        جارٍ تحميل الدرس...
    </div>


    <section
        id="lessonHeader"
        class="lesson-header"
        style="display:none"
    >

        <div>
            HAMOU MATH
        </div>

        <h1 id="lessonTitle">
            —
        </h1>

        <p id="lessonCourse">
            —
        </p>

    </section>


    <section
        id="lessonContent"
        class="lesson-content"
        style="display:none"
    >

        <div id="lessonText">
        </div>


        <div
            id="lessonVideo"
            class="lesson-video"
            style="display:none"
        >
        </div>


        <div class="lesson-actions">

            <a
                href="exercises.html"
                class="lesson-btn"
            >
                📝 تمارين
            </a>

            <a
                href="excellence.html"
                class="lesson-btn"
            >
                🎯 مركز التفوق
            </a>

        </div>


        <div class="related-exercises">

            <h2>
                📝 تمارين مرتبطة بهذا الدرس
            </h2>

            <div id="relatedExercises">
                جارٍ التحميل...
            </div>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="../js/theme.js"></script>

<script src="../js/navbar.js"></script>

<script src="../js/lesson.js"></script>

</body>
</html>
