<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="استرجاع كلمة المرور - HAMOU MATH"
    >

    <title>
        استرجاع كلمة المرور | HAMOU MATH
    </title>

    <link
        rel="icon"
        href="../assets/logo.svg"
    >

    <style>

        :root {
            --primary: #1565c0;
            --dark: #082b5c;
            --bg: #f4f8ff;
            --text: #172033;
            --muted: #64748b;
            --border: #dbe5f1;
        }

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            color: var(--text);

            background:
                linear-gradient(
                    180deg,
                    #f8fbff,
                    var(--bg)
                );
        }

        .page {

            min-height:
                calc(100vh - 70px);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                35px 15px;
        }

        .card {

            width:
                min(450px,100%);

            padding:
                31px;

            background:
                white;

            border:
                1px solid
                var(--border);

            border-radius:
                24px;

            box-shadow:
                0 25px 70px
                rgba(8,43,92,.12);
        }

        .logo {

            width:
                52px;

            height:
                52px;

            margin:
                0 auto 17px;

            display:
                grid;

            place-items:
                center;

            border-radius:
                16px;

            color:
                white;

            background:
                linear-gradient(
                    135deg,
                    #082b5c,
                    #1565c0,
                    #00bcd4
                );

            font-size:
                23px;

            font-weight:
                900;
        }

        h1 {

            margin:
                0 0 10px;

            color:
                var(--dark);

            text-align:
                center;

            font-size:
                26px;
        }

        .description {

            margin:
                0 0 24px;

            color:
                var(--muted);

            text-align:
                center;

            font-size:
                13px;

            line-height:
                1.8;
        }

        label {

            display:
                block;

            margin-bottom:
                7px;

            color:
                var(--dark);

            font-size:
                13px;

            font-weight:
                800;
        }

        input {

            width:
                100%;

            padding:
                13px;

            border:
                1px solid
                var(--border);

            border-radius:
                12px;

            font:
                inherit;

            outline:
                none;
        }

        input:focus {

            border-color:
                #1565c0;

            box-shadow:
                0 0 0 4px
                rgba(21,101,192,.09);
        }

        button {

            width:
                100%;

            margin-top:
                17px;

            padding:
                13px;

            border:
                0;

            border-radius:
                12px;

            background:
                #1565c0;

            color:
                white;

            font:
                inherit;

            font-weight:
                900;

            cursor:
                pointer;
        }

        button:disabled {

            opacity:
                .65;

            cursor:
                wait;
        }

        .message {

            display:
                none;

            margin-top:
                14px;

            padding:
                12px;

            border-radius:
                11px;

            font-size:
                13px;

            line-height:
                1.7;
        }

        .message.show {
            display:
                block;
        }

        .message.error {

            background:
                #fee2e2;

            color:
                #991b1b;
        }

        .message.success {

            background:
                #dcfce7;

            color:
                #166534;
        }

        .back {

            display:
                block;

            margin-top:
                18px;

            color:
                #1565c0;

            text-align:
                center;

            font-size:
                13px;

            font-weight:
                800;
        }

        @media (max-width: 500px) {

            .card {

                padding:
                    24px 18px;

                border-radius:
                    20px;
            }

        }

    </style>

</head>

<body>

<div id="hamou-navbar"></div>

<main class="page">

<section class="card">

    <div class="logo">
        ∑
    </div>

    <h1>
        🔑 استرجاع كلمة المرور
    </h1>

    <p class="description">
        أدخل بريدك الإلكتروني وسنرسل لك رابطًا
        لإعادة تعيين كلمة المرور.
    </p>

    <form id="resetForm">

        <label for="email">
            البريد الإلكتروني
        </label>

        <input
            id="email"
            type="email"
            autocomplete="email"
            maxlength="255"
            required
            placeholder="example@email.com"
        >

        <button
            id="button"
            type="submit"
        >
            إرسال رابط الاستعادة
        </button>

        <div
            id="message"
            class="message"
            role="alert"
        ></div>

    </form>

    <a
        href="login.html"
        class="back"
    >
        ← العودة إلى تسجيل الدخول
    </a>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/navbar.js"></script>

<script>

(function () {

    "use strict";

    const form =
        document.getElementById(
            "resetForm"
        );

    const email =
        document.getElementById(
            "email"
        );

    const button =
        document.getElementById(
            "button"
        );

    const message =
        document.getElementById(
            "message"
        );

    function show(
        text,
        success = false
    ) {

        message.textContent =
            text;

        message.className =
            `message show ${
                success
                    ? "success"
                    : "error"
            }`;
    }

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const emailValue =
                email.value
                    .trim()
                    .toLowerCase();

            if (!emailValue) {

                show(
                    "أدخل البريد الإلكتروني."
                );

                return;
            }

            button.disabled =
                true;

            button.textContent =
                "جارِ الإرسال...";

            try {

                const {
                    error
                } =
                    await supabaseClient
                        .auth
                        .resetPasswordForEmail(
                            emailValue,
                            {
                                redirectTo:
                                    `${window.location.origin}/pages/reset-password.html`
                            }
                        );

                if (error) {
                    throw error;
                }

                show(
                    "تم إرسال رابط الاستعادة. تحقق من بريدك الإلكتروني.",
                    true
                );

            } catch (error) {

                console.error(
                    "HAMOU MATH reset:",
                    error
                );

                const text =
                    String(
                        error?.message ||
                        ""
                    ).toLowerCase();

                if (
                    text.includes(
                        "invalid api key"
                    )
                ) {

                    show(
                        "مفتاح Supabase غير صالح. تحقق من js/supabase.js."
                    );

                } else {

                    show(
                        "تعذر إرسال رابط الاستعادة: " +
                        (
                            error?.message ||
                            "خطأ غير معروف"
                        )
                    );
                }

            } finally {

                button.disabled =
                    false;

                button.textContent =
                    "إرسال رابط الاستعادة";
            }

        }
    );

})();

</script>

</body>
</html>
