<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
استرجاع كلمة المرور | HAMOU MATH
</title>

<link
    rel="icon"
    href="../assets/logo.svg"
>

<style>

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #f8fbff,
            #f4f8ff
        );

    color: #172033;
}

.page {

    min-height:
        calc(100vh - 70px);

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding: 30px 15px;
}

.card {

    width:
        min(440px, 100%);

    background: white;

    border:
        1px solid #dbe5f1;

    border-radius: 23px;

    padding: 30px;

    box-shadow:
        0 25px 70px
        rgba(8,43,92,.11);
}

h1 {

    margin:
        0 0 9px;

    color:
        #082b5c;

    text-align:
        center;
}

p {

    color:
        #64748b;

    text-align:
        center;

    font-size:
        13px;
}

label {

    display:
        block;

    margin:
        18px 0 7px;

    font-weight:
        800;
}

input {

    width:
        100%;

    box-sizing:
        border-box;

    padding:
        13px;

    border:
        1px solid #dbe5f1;

    border-radius:
        12px;

    font:
        inherit;

    outline:
        none;
}

input:focus {

    border-color:
        #1565c0;

    box-shadow:
        0 0 0 4px
        rgba(21,101,192,.09);
}

button {

    width:
        100%;

    margin-top:
        16px;

    padding:
        13px;

    border:
        0;

    border-radius:
        12px;

    color:
        white;

    background:
        linear-gradient(
            135deg,
            #1565c0,
            #0d47a1
        );

    font:
        inherit;

    font-weight:
        900;

    cursor:
        pointer;
}

.message {

    display:
        none;

    margin-top:
        15px;

    padding:
        11px;

    border-radius:
        11px;

    font-size:
        13px;

}

.message.show {
    display: block;
}

.error {

    background:
        #fee2e2;

    color:
        #991b1b;
}

.success {

    background:
        #dcfce7;

    color:
        #166534;
}

.back {

    display:
        block;

    margin-top:
        18px;

    text-align:
        center;

    color:
        #1565c0;

    font-size:
        13px;

    font-weight:
        800;
}

</style>

</head>

<body>

<div id="hamou-navbar"></div>

<main class="page">

<section class="card">

<h1>
🔑 استرجاع كلمة المرور
</h1>

<p>
أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور.
</p>

<form id="resetForm">

<label for="email">
البريد الإلكتروني
</label>

<input
    id="email"
    type="email"
    autocomplete="email"
    required
    placeholder="example@email.com"
>

<button
    id="button"
    type="submit"
>
إرسال الرابط
</button>

<div
    id="message"
    class="message"
></div>

</form>

<a
    class="back"
    href="login.html"
>
← العودة إلى تسجيل الدخول
</a>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/navbar.js"></script>

<script>

(function () {

    "use strict";

    const form =
        document.getElementById(
            "resetForm"
        );

    const email =
        document.getElementById(
            "email"
        );

    const button =
        document.getElementById(
            "button"
        );

    const message =
        document.getElementById(
            "message"
        );

    function show(
        text,
        success
    ) {

        message.textContent =
            text;

        message.className =
            `message show ${
                success
                    ? "success"
                    : "error"
            }`;
    }

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            button.disabled =
                true;

            button.textContent =
                "جارِ الإرسال...";

            try {

                const {
                    error
                } =
                    await supabaseClient
                        .auth
                        .resetPasswordForEmail(
                            email.value
                                .trim()
                                .toLowerCase(),
                            {
                                redirectTo:
                                    `${window.location.origin}/pages/reset-password.html`
                            }
                        );

                if (error) {
                    throw error;
                }

                show(
                    "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك.",
                    true
                );

            } catch (error) {

                console.error(error);

                show(
                    "تعذر إرسال الرابط: " +
                    error.message,
                    false
                );

            } finally {

                button.disabled =
                    false;

                button.textContent =
                    "إرسال الرابط";
            }

        }
    );

})();

</script>

</body>
</html>
