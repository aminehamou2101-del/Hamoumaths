<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>لوحة الأستاذ - HAMOU MATH</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<header>

<h1>
👨‍🏫 لوحة الأستاذ
</h1>

<a href="dashboard.html">
العودة
</a>

</header>



<main class="teacher-dashboard">


<h2>
إضافة محتوى جديد
</h2>


<section class="panel">


<h3>
📚 إضافة مورد (كتاب / PDF)
</h3>


<input id="title"
placeholder="عنوان الملف">


<textarea id="description"
placeholder="الوصف">
</textarea>



<select id="type">

<option value="pdf">
PDF
</option>

<option value="book">
كتاب
</option>

<option value="exercise">
تمرين
</option>

</select>



<input id="fileUrl"
placeholder="رابط الملف PDF">



<button onclick="addResource()">
إضافة
</button>


</section>




<section class="panel">


<h3>
📖 إضافة درس
</h3>


<input id="lessonTitle"
placeholder="عنوان الدرس">


<textarea id="lessonContent"
placeholder="محتوى الدرس">
</textarea>



<button onclick="addLesson()">
حفظ الدرس
</button>


</section>



<div id="myResources">

</div>



</main>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase-config.js"></script>

<script src="../js/auth.js"></script>

<script src="../js/teacher.js"></script>


</body>

</html>
