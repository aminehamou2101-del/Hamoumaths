<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        إنشاء حساب | HAMOU MATH
    </title>

    <link
        rel="icon"
        href="../assets/logo.svg"
    >

    <style>

        :root {
            --primary: #1565c0;
            --dark: #082b5c;
            --bg: #f4f8ff;
            --text: #172033;
            --muted: #64748b;
            --border: #dbe5f1;
        }

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(0,188,212,.10),
                    transparent 28%
                ),
                linear-gradient(
                    180deg,
                    #f8fbff,
                    var(--bg)
                );

            color: var(--text);
        }

        .page {

            min-height:
                calc(100vh - 70px);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                40px 15px;
        }

        .card {

            width:
                min(500px, 100%);

            background: #fff;

            border:
                1px solid
                var(--border);

            border-radius:
                25px;

            padding:
                32px;

            box-shadow:
                0 25px 70px
                rgba(8,43,92,.12);
        }

        .brand {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                10px;

            color:
                var(--dark);

            font-weight:
                900;

            font-size:
                21px;

            margin-bottom:
                20px;
        }

        .logo {

            width:
                48px;

            height:
                48px;

            display:
                grid;

            place-items:
                center;

            border-radius:
                15px;

            color:
                #fff;

            background:
                linear-gradient(
                    135deg,
                    #082b5c,
                    #1565c0,
                    #00bcd4
                );
        }

        h1 {

            text-align:
                center;

            color:
                var(--dark);

            font-size:
                27px;

            margin:
                0 0 8px;
        }

        .subtitle {

            color:
                var(--muted);

            text-align:
                center;

            font-size:
                13px;

            margin:
                0 0 23px;
        }

        .field {
            margin-bottom:
                15px;
        }

        label {

            display:
                block;

            margin-bottom:
                6px;

            color:
                var(--dark);

            font-weight:
                800;

            font-size:
                13px;
        }

        input {

            width:
                100%;

            padding:
                13px;

            border:
                1px solid
                var(--border);

            border-radius:
                12px;

            font:
                inherit;

            outline:
                none;
        }

        input:focus {

            border-color:
                var(--primary);

            box-shadow:
                0 0 0 4px
                rgba(21,101,192,.09);
        }

        .button {

            width:
                100%;

            border:
                0;

            border-radius:
                12px;

            padding:
                13px;

            color:
                white;

            background:
                linear-gradient(
                    135deg,
                    #1565c0,
                    #0d47a1
                );

            font:
                inherit;

            font-weight:
                900;

            cursor:
                pointer;
        }

        .button:disabled {
            opacity:
                .65;

            cursor:
                not-allowed;
        }

        .message {

            display:
                none;

            margin-top:
                14px;

            padding:
                12px;

            border-radius:
                11px;

            font-size:
                13px;
        }

        .message.show {
            display:
                block;
        }

        .error {

            background:
                #fee2e2;

            color:
                #991b1b;
        }

        .success {

            background:
                #dcfce7;

            color:
                #166534;
        }

        .login-link {

            margin-top:
                18px;

            text-align:
                center;

            color:
                var(--muted);

            font-size:
                13px;
        }

        .login-link a {

            color:
                var(--primary);

            font-weight:
                800;
        }

        .password-help {

            color:
                var(--muted);

            font-size:
                11px;

            margin-top:
                5px;
        }

        @media (max-width: 500px) {

            .card {
                padding:
                    23px 18px;

                border-radius:
                    19px;
            }
        }

    </style>

</head>

<body>

<div id="hamou-navbar"></div>

<main class="page">

    <section class="card">

        <div class="brand">

            <div class="logo">
                ∑
            </div>

            HAMOU MATH

        </div>

        <h1>
            🚀 إنشاء حساب
        </h1>

        <p class="subtitle">
            أنشئ حسابك وابدأ مسارك في الرياضيات.
        </p>

        <form id="registerForm">

            <div class="field">

                <label for="name">
                    الاسم الكامل
                </label>

                <input
                    id="name"
                    type="text"
                    autocomplete="name"
                    minlength="2"
                    maxlength="100"
                    required
                    placeholder="اكتب اسمك الكامل"
                >

            </div>

            <div class="field">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    maxlength="255"
                    required
                    placeholder="example@email.com"
                >

            </div>

            <div class="field">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                    placeholder="8 أحرف على الأقل"
                >

                <div class="password-help">
                    استخدم كلمة مرور قوية ولا تشاركها مع أي شخص.
                </div>

            </div>

            <button
                id="registerButton"
                class="button"
                type="submit"
            >
                إنشاء الحساب
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </form>

        <div class="login-link">

            لديك حساب بالفعل؟

            <a href="login.html">
                تسجيل الدخول
            </a>

        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/navbar.js"></script>

<script>

(function () {

    "use strict";

    const form =
        document.getElementById(
            "registerForm"
        );

    const name =
        document.getElementById(
            "name"
        );

    const email =
        document.getElementById(
            "email"
        );

    const password =
        document.getElementById(
            "password"
        );

    const button =
        document.getElementById(
            "registerButton"
        );

    const message =
        document.getElementById(
            "message"
        );

    function showMessage(
        text,
        success = false
    ) {

        message.textContent =
            text;

        message.className =
            `message show ${
                success
                    ? "success"
                    : "error"
            }`;
    }

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const fullName =
                name.value.trim();

            const emailValue =
                email.value
                    .trim()
                    .toLowerCase();

            const passwordValue =
                password.value;

            if (
                fullName.length < 2
            ) {

                showMessage(
                    "أدخل اسمًا صحيحًا."
                );

                return;
            }

            if (
                passwordValue.length < 8
            ) {

                showMessage(
                    "كلمة المرور يجب أن تكون 8 أحرف على الأقل."
                );

                return;
            }

            button.disabled =
                true;

            button.textContent =
                "جارِ إنشاء الحساب...";

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signUp({
                            email:
                                emailValue,

                            password:
                                passwordValue,

                            options: {
                                data: {
                                    full_name:
                                        fullName
                                }
                            }
                        });

                if (error) {
                    throw error;
                }

                /*
                 * إذا كانت تأكيدات البريد مفعّلة
                 * فلن تكون session موجودة.
                 */

                if (
                    data.user &&
                    !data.session
                ) {

                    showMessage(
                        "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيد الحساب.",
                        true
                    );

                } else {

                    showMessage(
                        "تم إنشاء الحساب بنجاح. جارِ فتح لوحتك...",
                        true
                    );

                    setTimeout(
                        () => {

                            window.location.href =
                                "dashboard.html";

                        },
                        700
                    );
                }

            } catch (error) {

                console.error(error);

                showMessage(
                    translateRegisterError(
                        error
                    )
                );

                button.disabled =
                    false;

                button.textContent =
                    "إنشاء الحساب";
            }
        }
    );

    function translateRegisterError(
        error
    ) {

        const text =
            String(
                error?.message || ""
            ).toLowerCase();

        if (
            text.includes(
                "user already registered"
            )
        ) {

            return "هذا البريد الإلكتروني مسجل بالفعل. حاول تسجيل الدخول.";
        }

        if (
            text.includes(
                "password"
            )
        ) {

            return (
                "كلمة المرور غير مقبولة: " +
                error.message
            );
        }

        return (
            "تعذر إنشاء الحساب: " +
            (
                error?.message ||
                "خطأ غير معروف"
            )
        );
    }

})();

</script>

</body>
</html>
