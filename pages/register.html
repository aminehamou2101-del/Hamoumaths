<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="إنشاء حساب جديد في منصة HAMOU MATH"
    >

    <title>إنشاء حساب | HAMOU MATH</title>

    <link
        rel="icon"
        href="../assets/logo.svg"
    >

    <style>

        :root {
            --primary: #1565c0;
            --primary-dark: #0d47a1;
            --secondary: #00bcd4;
            --dark: #082b5c;
            --bg: #f4f8ff;
            --text: #172033;
            --muted: #64748b;
            --border: #dbe5f1;
        }

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at top left,
                    rgba(0,188,212,.11),
                    transparent 28%
                ),
                linear-gradient(
                    180deg,
                    #f8fbff,
                    var(--bg)
                );
        }

        .page {

            min-height:
                calc(100vh - 70px);

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            padding:
                35px 15px;
        }

        .card {

            width:
                min(510px,100%);

            padding:
                32px;

            background:
                #fff;

            border:
                1px solid
                var(--border);

            border-radius:
                25px;

            box-shadow:
                0 25px 70px
                rgba(8,43,92,.12);
        }

        .brand {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                10px;

            margin-bottom:
                22px;

            color:
                var(--dark);

            font-size:
                21px;

            font-weight:
                900;
        }

        .logo {

            width:
                50px;

            height:
                50px;

            display:
                grid;

            place-items:
                center;

            border-radius:
                15px;

            background:
                linear-gradient(
                    135deg,
                    var(--dark),
                    var(--primary),
                    var(--secondary)
                );

            color:
                #fff;
        }

        h1 {

            margin:
                0 0 8px;

            color:
                var(--dark);

            text-align:
                center;

            font-size:
                27px;
        }

        .subtitle {

            margin:
                0 0 24px;

            color:
                var(--muted);

            text-align:
                center;

            font-size:
                13px;
        }

        .field {
            margin-bottom:
                16px;
        }

        label {

            display:
                block;

            margin-bottom:
                7px;

            color:
                var(--dark);

            font-size:
                13px;

            font-weight:
                800;
        }

        input {

            width:
                100%;

            padding:
                13px 14px;

            border:
                1px solid
                var(--border);

            border-radius:
                12px;

            color:
                var(--text);

            background:
                white;

            font:
                inherit;

            outline:
                none;
        }

        input:focus {

            border-color:
                var(--primary);

            box-shadow:
                0 0 0 4px
                rgba(21,101,192,.09);
        }

        .help {

            margin-top:
                5px;

            color:
                var(--muted);

            font-size:
                11px;
        }

        .button {

            width:
                100%;

            padding:
                13px;

            border:
                0;

            border-radius:
                12px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-dark)
                );

            color:
                white;

            font:
                inherit;

            font-weight:
                900;

            cursor:
                pointer;
        }

        .button:disabled {

            opacity:
                .65;

            cursor:
                wait;
        }

        .message {

            display:
                none;

            margin-top:
                14px;

            padding:
                12px;

            border-radius:
                11px;

            font-size:
                13px;

            line-height:
                1.7;
        }

        .message.show {
            display:
                block;
        }

        .message.error {

            background:
                #fee2e2;

            color:
                #991b1b;
        }

        .message.success {

            background:
                #dcfce7;

            color:
                #166534;
        }

        .login {

            margin-top:
                18px;

            color:
                var(--muted);

            text-align:
                center;

            font-size:
                13px;
        }

        .login a {

            color:
                var(--primary);

            font-weight:
                800;
        }

        @media (max-width: 500px) {

            .card {

                padding:
                    24px 18px;

                border-radius:
                    20px;
            }

            h1 {
                font-size:
                    24px;
            }
        }

    </style>

</head>

<body>

<div id="hamou-navbar"></div>

<main class="page">

<section class="card">

    <div class="brand">

        <div class="logo">
            ∑
        </div>

        HAMOU MATH

    </div>

    <h1>
        🚀 إنشاء حساب
    </h1>

    <p class="subtitle">
        أنشئ حسابك وابدأ مسارك التعليمي.
    </p>

    <form
        id="registerForm"
        novalidate
    >

        <div class="field">

            <label for="fullName">
                الاسم الكامل
            </label>

            <input
                id="fullName"
                name="fullName"
                type="text"
                autocomplete="name"
                minlength="2"
                maxlength="100"
                required
                placeholder="اكتب اسمك الكامل"
            >

        </div>

        <div class="field">

            <label for="email">
                البريد الإلكتروني
            </label>

            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                maxlength="255"
                required
                placeholder="example@email.com"
            >

        </div>

        <div class="field">

            <label for="password">
                كلمة المرور
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                maxlength="72"
                required
                placeholder="8 أحرف على الأقل"
            >

            <div class="help">
                استخدم كلمة مرور قوية وخاصة بهذا الحساب.
            </div>

        </div>

        <div class="field">

            <label for="confirmPassword">
                تأكيد كلمة المرور
            </label>

            <input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                maxlength="72"
                required
                placeholder="أعد كتابة كلمة المرور"
            >

        </div>

        <button
            class="button"
            id="registerButton"
            type="submit"
        >
            إنشاء الحساب
        </button>

        <div
            id="message"
            class="message"
            role="alert"
        ></div>

    </form>

    <div class="login">

        لديك حساب بالفعل؟

        <a href="login.html">
            تسجيل الدخول
        </a>

    </div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/navbar.js"></script>

<script>

(function () {

    "use strict";

    const form =
        document.getElementById(
            "registerForm"
        );

    const fullName =
        document.getElementById(
            "fullName"
        );

    const email =
        document.getElementById(
            "email"
        );

    const password =
        document.getElementById(
            "password"
        );

    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        );

    const button =
        document.getElementById(
            "registerButton"
        );

    const message =
        document.getElementById(
            "message"
        );

    function showMessage(
        text,
        success = false
    ) {

        message.textContent =
            text;

        message.className =
            `message show ${
                success
                    ? "success"
                    : "error"
            }`;
    }

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const nameValue =
                fullName.value.trim();

            const emailValue =
                email.value
                    .trim()
                    .toLowerCase();

            const passwordValue =
                password.value;

            const confirmValue =
                confirmPassword.value;

            if (
                nameValue.length < 2
            ) {

                showMessage(
                    "أدخل الاسم الكامل بشكل صحيح."
                );

                return;
            }

            if (
                passwordValue.length < 8
            ) {

                showMessage(
                    "كلمة المرور يجب أن تتكون من 8 أحرف على الأقل."
                );

                return;
            }

            if (
                passwordValue !==
                confirmValue
            ) {

                showMessage(
                    "كلمتا المرور غير متطابقتين."
                );

                return;
            }

            button.disabled =
                true;

            button.textContent =
                "جارِ إنشاء الحساب...";

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signUp({
                            email:
                                emailValue,

                            password:
                                passwordValue,

                            options: {
                                data: {
                                    full_name:
                                        nameValue
                                },

                                emailRedirectTo:
                                    `${window.location.origin}/pages/login.html`
                            }
                        });

                if (error) {
                    throw error;
                }

                /*
                 * عند تفعيل Confirm Email
                 * لا تكون session متاحة مباشرة.
                 */

                if (
                    data?.user &&
                    !data?.session
                ) {

                    showMessage(
                        "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيد الحساب.",
                        true
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "إنشاء الحساب";

                    return;
                }

                if (
                    data?.user &&
                    data?.session
                ) {

                    showMessage(
                        "تم إنشاء الحساب بنجاح.",
                        true
                    );

                    setTimeout(
                        function () {

                            window.location.href =
                                "dashboard.html";

                        },
                        700
                    );

                    return;
                }

                throw new Error(
                    "لم يرجع Supabase بيانات المستخدم."
                );

            } catch (error) {

                console.error(
                    "HAMOU MATH register:",
                    error
                );

                const text =
                    String(
                        error?.message ||
                        ""
                    ).toLowerCase();

                if (
                    text.includes(
                        "invalid api key"
                    )
                ) {

                    showMessage(
                        "مفتاح Supabase غير صالح. تحقق من js/supabase.js."
                    );

                } else if (
                    text.includes(
                        "user already registered"
                    )
                ) {

                    showMessage(
                        "هذا البريد الإلكتروني مسجل بالفعل. استخدم تسجيل الدخول."
                    );

                } else {

                    showMessage(
                        "تعذر إنشاء الحساب: " +
                        (
                            error?.message ||
                            "خطأ غير معروف"
                        )
                    );
                }

                button.disabled =
                    false;

                button.textContent =
                    "إنشاء الحساب";
            }

        }
    );

})();

</script>

</body>
</html>
