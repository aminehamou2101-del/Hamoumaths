<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>مراجعة المحتوى | HAMOU MATH</title>

    <link
        rel="icon"
        href="../assets/logo.svg"
    >

    <style>

        body {
            margin: 0;
            background: #f4f8ff;
            color: #172033;
            font-family: Tahoma, Arial, sans-serif;
        }

        .container {
            width: min(1400px, 94%);
            margin: 30px auto 60px;
        }

        .hero {
            background:
                linear-gradient(
                    135deg,
                    #082b5c,
                    #1565c0
                );

            color: white;
            padding: 28px;
            border-radius: 24px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border: 1px solid #dbe5f1;
            border-radius: 20px;
            padding: 20px;
            box-shadow:
                0 12px 35px rgba(8,43,92,.07);
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr 200px;
            gap: 10px;
            margin-bottom: 18px;
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #dbe5f1;
            border-radius: 11px;
            font: inherit;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        th,
        td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fbff;
            color: #082b5c;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .lesson {
            background: #e0f2fe;
            color: #075985;
        }

        .exercise {
            background: #ede9fe;
            color: #5b21b6;
        }

        .resource {
            background: #dcfce7;
            color: #166534;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 8px 11px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        .open {
            background: #e8f1ff;
            color: #082b5c;
        }

        .approve {
            background: #dcfce7;
            color: #166534;
        }

        .reject {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading,
        .empty {
            padding: 30px;
            text-align: center;
            color: #64748b;
        }

        .status {
            display: none;
            padding: 12px;
            border-radius: 11px;
            margin-bottom: 15px;
        }

        .status.show {
            display: block;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        @media (max-width: 700px) {

            .container {
                width: 95%;
            }

            .toolbar {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div id="hamou-navbar"></div>

<main class="container">

    <section class="hero">

        <h1>
            🛡️ مركز مراجعة المحتوى
        </h1>

        <p>
            مراجعة الدروس والتمارين والموارد قبل نشرها.
        </p>

    </section>

    <div
        id="status"
        class="status"
    ></div>

    <section class="card">

        <div class="toolbar">

            <input
                id="search"
                placeholder="بحث في المحتوى..."
            >

            <select id="type">

                <option value="">
                    كل الأنواع
                </option>

                <option value="lesson">
                    الدروس
                </option>

                <option value="exercise">
                    التمارين
                </option>

                <option value="resource">
                    الموارد
                </option>

            </select>

        </div>

        <div
            id="table"
            class="table-wrap"
        >
            <div class="loading">
                جارِ تحميل المحتوى...
            </div>
        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/content-review.js"></script>

</body>

</html>
