<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1">

    <title>موضوع المنهاج | HAMOU MATH</title>

    <link rel="icon" href="../assets/logo.svg">

    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f8ff;
            color: #172033;
        }

        .container {
            width: min(1200px, 94%);
            margin: 30px auto 60px;
        }

        .hero {
            background: linear-gradient(
                135deg,
                #082b5c,
                #1565c0
            );
            color: #fff;
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 20px;
        }

        .hero h1 {
            margin: 0 0 10px;
        }

        .hero p {
            margin: 0;
            opacity: .9;
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .card {
            background: #fff;
            border: 1px solid #dbe5f1;
            border-radius: 18px;
            padding: 20px;
            box-shadow:
                0 12px 35px rgba(8,43,92,.07);
        }

        .card h2 {
            margin-top: 0;
            color: #082b5c;
        }

        .item {
            display: block;
            padding: 13px;
            margin: 9px 0;
            border-radius: 12px;
            background: #f7faff;
            border: 1px solid #e3ebf5;
            color: #172033;
        }

        .item:hover {
            border-color: #1565c0;
            transform: translateY(-1px);
        }

        .empty {
            color: #64748b;
            padding: 20px 0;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        .tag {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            background: #e8f1ff;
            color: #1565c0;
            font-size: 12px;
            margin-left: 5px;
        }
    </style>
</head>

<body>

<div id="hamou-navbar"></div>

<main class="container">

    <section class="hero">
        <h1 id="topicTitle">
            جارِ التحميل...
        </h1>

        <p id="topicDescription"></p>
    </section>

    <section class="grid">

        <div class="card">
            <h2>📚 الدروس</h2>
            <div id="lessons">
                <div class="loading">
                    جارِ التحميل...
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📝 التمارين</h2>
            <div id="exercises">
                <div class="loading">
                    جارِ التحميل...
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📁 الموارد</h2>
            <div id="resources">
                <div class="loading">
                    جارِ التحميل...
                </div>
            </div>
        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/curriculum-topic.js"></script>

</body>
</html>
