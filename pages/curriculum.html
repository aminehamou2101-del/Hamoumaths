<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>منهج الرياضيات | HAMOU MATH</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .curriculum-page {
            width: min(1150px, 94%);
            margin: 35px auto 80px;
        }

        .curriculum-hero {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 42px 30px;
            border-radius: 28px;
            text-align: center;
            margin-bottom: 25px;
        }

        .curriculum-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .curriculum-card {
            display: block;
            text-decoration: none;

            background: var(--surface, #fff);
            color: var(--text, #222);

            padding: 25px;
            border-radius: 22px;

            box-shadow:
                0 10px 30px rgba(0,0,0,.07);
        }

        .curriculum-card:hover {
            transform: translateY(-4px);
        }

        .curriculum-icon {
            font-size: 45px;
        }

        .curriculum-card h2 {
            color: #1565c0;
        }
    </style>
</head>

<body>

<div id="hamou-navbar"></div>

<main class="curriculum-page">

    <section class="curriculum-hero">

        <h1>
            📚 منهج الرياضيات
        </h1>

        <p>
            اختر المستوى ثم انتقل إلى الوحدات والمواضيع.
        </p>

    </section>


    <section class="curriculum-grid">

        <a
            class="curriculum-card"
            href="topics.html?level=متوسط"
        >
            <div class="curriculum-icon">📘</div>
            <h2>متوسط</h2>
            <p>منهج التعليم المتوسط.</p>
        </a>


        <a
            class="curriculum-card"
            href="topics.html?level=1%20ثانوي"
        >
            <div class="curriculum-icon">📗</div>
            <h2>1 ثانوي</h2>
            <p>منهج السنة الأولى ثانوي.</p>
        </a>


        <a
            class="curriculum-card"
            href="topics.html?level=2%20ثانوي"
        >
            <div class="curriculum-icon">📕</div>
            <h2>2 ثانوي</h2>
            <p>منهج السنة الثانية ثانوي.</p>
        </a>


        <a
            class="curriculum-card"
            href="topics.html?level=3%20ثانوي"
        >
            <div class="curriculum-icon">📙</div>
            <h2>3 ثانوي</h2>
            <p>منهج السنة الثالثة ثانوي.</p>
        </a>


        <a
            class="curriculum-card"
            href="topics.html?level=بكالوريا"
        >
            <div class="curriculum-icon">🎓</div>
            <h2>بكالوريا</h2>
            <p>منهج ومراجعة البكالوريا.</p>
        </a>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/navbar.js"></script>

</body>
</html>
