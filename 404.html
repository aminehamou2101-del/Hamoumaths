<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>الصفحة غير موجودة | HAMOU MATH</title>

  <meta name="robots" content="noindex,nofollow">

  <meta name="theme-color" content="#2563eb">

  <link rel="manifest" href="/manifest.webmanifest">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family:
        system-ui,
        -apple-system,

        sans-serif;

      background: rgba(255,255,255,.96);
      padding: 45px 25px;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(15,23,42,.12);
      border: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: #2563eb;
      margin-bottom: 25px;
    }

    .number {
      font-size: 90px;
      line-height: 1;
      font-weight: 1000;
      color: #2563eb;
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 30px;
    }

    p {
      color: #64748b;
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 25px;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <main class="box">

    <div class="logo">∑ HAMOU MATH</div>

    <p>
      يبدو أن الصفحة التي تبحث عنها غير موجودة أو تم نقلها.
      يمكنك العودة إلى منصة HAMOU MATH ومتابعة التعلم.
    </p>

    <a href="/">
      العودة إلى HAMOU MATH

</html>
