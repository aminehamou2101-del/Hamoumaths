<script>
function check(v){
    let r=document.getElementById('result');
    if(v===10){
        r.textContent='✅ إجابة صحيحة! ممتاز 👏';
        r.style.color='#16824a';
    }else{
        r.textContent='❌ ليست صحيحة. حاول من جديد.';
        r.style.color='#b23a3a';
    }
}

let running=false, interval;
function start(){
    if(running) return;
    running=true;
    let n=30, t=document.getElementById('timer');
    t.textContent=n;
    interval=setInterval(()=>{
        n--;
        t.textContent=n;
        if(n<=0){
            clearInterval(interval);
            running=false;
            alert('انتهى التحدي! حاول مرة أخرى 💪');
        }
    }, 1000);
}

const SUPABASE_URL = 'https://ifurlsucekmaynuhsfva.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WRvn0kt8kJ3SSy2WG1ca4w_dzZQBrBU';

let supabase;
try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (err) {
    console.error("Supabase init error:", err);
}

const form = document.getElementById('uploadForm');
const message = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!supabase) {
        message.style.color = 'red';
        message.textContent = 'خطأ في الاتصال بقاعدة البيانات.';
        return;
    }

    const title = document.getElementById('title').value;
    const fileInput = document.getElementById('fileInput').files[0];

    if (!fileInput) {
        message.style.color = 'red';
        message.textContent = 'الرجاء اختيار ملف PDF.';
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري الرفع...';
    message.textContent = '';

    try {
        const fileName = `${Date.now()}-${fileInput.name}`;
        const { data: uploadData, error: uploadError } = await supabase.storage
            .from('pdfs')
            .upload(fileName, fileInput);

        if (uploadError) throw uploadError;

        const { data: publicUrlData } = supabase.storage
            .from('pdfs')
            .getPublicUrl(fileName);

        const fileUrl = publicUrlData.publicUrl;

        const { error: dbError } = await supabase
            .from('files')
            .insert([{ Title: title, file_url: fileUrl, status: 'pending' }]);

        if (dbError) throw dbError;

        message.style.color = 'green';
        message.textContent = 'تم رفع الملف بنجاح! سيتم مراجعته ونشره قريباً.';
        form.reset();
    } catch (error) {
        console.error(error);
        message.style.color = 'red';
        message.textContent = 'خطأ: ' + (error.message || 'فشل الرفع، تحقق من إعدادات Supabase');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'إرسال للمراجعة';
    }
});
</script>
