<style>
:root{
  --primary:#2563eb;
  --secondary:#7c3aed;
  --cyan:#06b6d4;
  --green:#10b981;
  --red:#ef4444;
  --yellow:#f59e0b;

  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;

  --shadow:0 15px 45px rgba(15,23,42,.08);
  --radius:20px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      circle at top right,
      rgba(37,99,235,.10),
      transparent 30%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    Tahoma,
    Arial,
    "Segoe UI",
    sans-serif;
  line-height:1.65;
}

body.dark{
  --bg:#07111f;
  --card:#0f1c2e;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:#1e334d;
  --shadow:0 15px 45px rgba(0,0,0,.28);
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.container{
  width:min(1220px,92%);
  margin:auto;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.dark header{
  background:rgba(7,17,31,.90);
}

.nav{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:900;
}

.logoMark{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  color:#fff;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    var(--primary),
    var(--secondary)
  );
  box-shadow:0 10px 25px rgba(37,99,235,.28);
}

.gradient{
  background:linear-gradient(
    90deg,
    var(--primary),
    var(--secondary),
    var(--cyan)
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.navLinks{
  display:flex;
  gap:4px;
}

.navLinks button,
.iconBtn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 12px;
  border-radius:12px;
  font-weight:800;
}

.navLinks button:hover,
.iconBtn:hover{
  background:rgba(37,99,235,.09);
  color:var(--primary);
}

.actions{
  display:flex;
  gap:5px;
}

.iconBtn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
}

section{
  padding:45px 0;
}

.hero{
  padding:70px 0 40px;
}

.heroGrid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:30px;
  align-items:center;
}

.badge{
  display:inline-flex;
  padding:6px 13px;
  border-radius:999px;
  background:rgba(37,99,235,.10);
  color:var(--primary);
  font-weight:900;
  font-size:12px;
}

.hero h1{
  font-size:clamp(42px,6vw,76px);
  line-height:1.04;
  margin:18px 0;
}

.heroText{
  max-width:760px;
  color:var(--muted);
  font-size:18px;
}

.searchBox{
  display:flex;
  gap:7px;
  padding:7px;
  margin-top:22px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--card);
  box-shadow:var(--shadow);
}

.searchBox input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:12px;
}

.btn{
  border:0;
  border-radius:13px;
  padding:11px 17px;
  font-weight:900;
}

.primary{
  color:#fff;
  background:linear-gradient(
    135deg,
    var(--primary),
    var(--secondary)
  );
}

.secondary{
  color:var(--text);
  background:var(--card);
  border:1px solid var(--border);
}

.green{
  color:#fff;
  background:var(--green);
}

.red{
  color:#fff;
  background:var(--red);
}

.heroButtons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:13px;
}

.heroCard{
  min-height:360px;
  padding:30px;
  border-radius:30px;
  color:#fff;
  background:linear-gradient(
    145deg,
    #2563eb,
    #7c3aed
  );
  box-shadow:0 30px 80px rgba(37,99,235,.30);
}

.formula{
  direction:ltr;
  text-align:center;
  font-size:38px;
  font-weight:900;
  margin:60px 0;
}

.miniGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mini{
  padding:13px;
  border-radius:15px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.20);
}

.mini b{
  display:block;
  font-size:23px;
}

.sectionHead{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:15px;
  margin-bottom:18px;
