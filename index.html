<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="HAMOU MATH - منصة تفاعلية لتعلم الرياضيات والدروس والتمارين والكتب والتحديات والتحضير للبكالوريا.">
<meta name="author" content="HAMOU MATH - حمو محمد أمين">
<meta name="robots" content="index,follow">

<title>HAMOU MATH V16.1 | سلسلة حمو في الرياضيات</title>

<style>
:root{
  --primary:#2563eb;
  --primary2:#1d4ed8;
  --secondary:#06b6d4;
  --success:#16a34a;
  --warning:#f59e0b;
  --danger:#ef4444;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --radius:20px;
  --header:72px;
}

html.dark{
  --bg:#0b1120;
  --card:#111827;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --border:#243044;
  --shadow:0 12px 35px rgba(0,0,0,.3);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Arabic",sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.25s;
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1180px,calc(100% - 28px));
  margin:auto;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  height:var(--header);
  background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(14px);
}

.dark header{
  background:rgba(11,17,32,.92);
}

.header-inner{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:max-content;
}

.logo{
  width:44px;
  height:44px;
  border-radius:14px;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  color:white;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:19px;
  box-shadow:0 8px 20px rgba(37,99,235,.25);
}

.brand-title{
  font-weight:900;
  font-size:17px;
}

.brand-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.desktop-nav{
  display:flex;
  align-items:center;
  gap:5px;
}

.nav-btn,
.icon-btn,
.lang-btn{
  border:0;
  background:transparent;
  color:var(--text);
  padding:10px 12px;
  border-radius:12px;
  transition:.2s;
}

.nav-btn:hover,
.icon-btn:hover,
.lang-btn:hover{
  background:rgba(37,99,235,.09);
  color:var(--primary);
}

.nav-btn.active{
  background:rgba(37,99,235,.1);
  color:var(--primary);
  font-weight:800;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:5px;
}

.theme-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  width:42px;
  height:42px;
  border-radius:13px;
}

.language-box{
  position:relative;
}

.language-menu{
  position:absolute;
  top:48px;
  left:0;
  width:145px;
  padding:7px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:var(--shadow);
  display:none;
}

.language-menu.show{
  display:block;
}

.language-menu button{
  width:100%;
  text-align:right;
  border:0;
  background:transparent;
  color:var(--text);
  padding:10px;
  border-radius:10px;
}

.language-menu button:hover{
  background:rgba(37,99,235,.1);
}

/* HERO */
.hero{
  padding:55px 0 30px;
}

.hero-box{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 90% 20%,rgba(6,182,212,.22),transparent 30%),
    radial-gradient(circle at 10% 80%,rgba(37,99,235,.22),transparent 32%),
    linear-gradient(135deg,#0f3fae,#2563eb 55%,#0891b2);
  color:white;
  border-radius:30px;
  padding:48px;
  box-shadow:0 20px 50px rgba(37,99,235,.2);
}

.hero-box:after{
  content:"∑  √  π  ∞";
  position:absolute;
  left:25px;
  bottom:15px;
  opacity:.1;
  font-size:70px;
  font-weight:900;
}

.hero h1{
  margin:0 0 15px;
  font-size:clamp(30px,5vw,52px);
  line-height:1.1;
}

.hero p{
  max-width:720px;
  line-height:1.9;
  font-size:17px;
  opacity:.94;
}

.hero-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:25px;
}

.btn{
  border:0;
  border-radius:13px;
  padding:12px 18px;
  font-weight:800;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-primary{
  background:white;
  color:#1d4ed8;
}

.btn-blue{
  background:var(--primary);
  color:white;
}

.btn-outline{
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin:15px 0 30px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
}

.stat-icon{
  font-size:25px;
}

.stat-number{
  font-size:26px;
  font-weight:900;
  margin-top:8px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

/* SECTIONS */
.section{
  margin:35px 0;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:17px;
}

.section-title{
  margin:0;
  font-size:25px;
}

.section-desc{
  color:var(--muted);
  margin-top:5px;
  font-size:14px;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  transition:.22s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:rgba(37,99,235,.35);
}

.card-icon{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:rgba(37,99,235,.1);
  font-size:23px;
  margin-bottom:14px;
}

.card h3{
  margin:0 0 8px;
}

.card p{
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
}

.card-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

/* COURSE */
.course-card{
  position:relative;
  overflow:hidden;
}

.course-card .level{
  position:absolute;
  top:15px;
  left:15px;
  background:rgba(37,99,235,.1);
  color:var(--primary);
  border-radius:999px;
  padding:5px 10px;
  font-size:11px;
  font-weight:800;
}

.progress{
  height:8px;
  background:var(--border);
  border-radius:99px;
  overflow:hidden;
  margin-top:12px;
}

.progress-bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  border-radius:99px;
  transition:.4s;
}

/* SEARCH */
.search-area{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:220px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:13px 15px;
  border-radius:14px;
  outline:none;
}

.search:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.filter{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:14px;
  padding:0 13px;
}

/* BOOK */
.book-card{
  display:flex;
  flex-direction:column;
}

.book-cover{
  height:150px;
  border-radius:16px;
  background:linear-gradient(135deg,#172554,#2563eb,#06b6d4);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  font-size:21px;
  font-weight:900;
  margin-bottom:15px;
}

.tag{
  display:inline-flex;
  width:max-content;
  padding:5px 9px;
  border-radius:999px;
  background:rgba(6,182,212,.12);
  color:#0891b2;
  font-size:11px;
  font-weight:800;
}

/* READER */
.reader{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:25px;
  box-shadow:var(--shadow);
}

.reader h2{
  margin-top:0;
}

.reader-content{
  line-height:2;
  color:var(--text);
}

.math{
  direction:ltr;
  text-align:center;
  font-size:20px;
  padding:14px;
  margin:14px 0;
  background:rgba(37,99,235,.07);
  border-radius:14px;
  font-family:Georgia,serif;
}

.lesson-list{
  display:grid;
  gap:10px;
}

.lesson-item{
  border:1px solid var(--border);
  background:var(--card);
  padding:14px;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.lesson-item.done{
  border-color:rgba(22,163,74,.4);
  background:rgba(22,163,74,.06);
}

/* QUIZ */
.quiz{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:25px;
  box-shadow:var(--shadow);
}

.question{
  font-size:20px;
  font-weight:900;
  line-height:1.7;
  margin-bottom:18px;
}

.options{
  display:grid;
  gap:10px;
}

.option{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:14px;
  border-radius:13px;
  text-align:right;
}

.option:hover{
  border-color:var(--primary);
  background:rgba(37,99,235,.06);
}

.option.correct{
  background:rgba(22,163,74,.12);
  border-color:var(--success);
}

.option.wrong{
  background:rgba(239,68,68,.12);
  border-color:var(--danger);
}

/* XP */
.xp-box{
  background:var(--card);
  border:1px solid var(--border);
  padding:22px;
  border-radius:20px;
  box-shadow:var(--shadow);
}

.xp-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.level-badge{
  background:rgba(37,99,235,.1);
  color:var(--primary);
  padding:7px 12px;
  border-radius:999px;
  font-weight:900;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(2,6,23,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  color:var(--text);
  border-radius:24px;
  padding:25px;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.close{
  border:0;
  background:rgba(239,68,68,.1);
  color:var(--danger);
  width:38px;
  height:38px;
  border-radius:12px;
}

/* TOAST */
.toast{
  position:fixed;
  z-index:3000;
  bottom:25px;
  right:25px;
  background:#0f172a;
  color:white;
  padding:13px 17px;
  border-radius:13px;
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  pointer-events:none;
  max-width:330px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* FOOTER */
footer{
  margin-top:50px;
  padding:35px 0 100px;
  border-top:1px solid var(--border);
  color:var(--muted);
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}

/* MOBILE NAV */
.mobile-nav{
  display:none;
  position:fixed;
  z-index:1500;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--border);
  backdrop-filter:blur(15px);
  padding:7px 5px calc(7px + env(safe-area-inset-bottom));
}

.dark .mobile-nav{
  background:rgba(11,17,32,.96);
}

.mobile-nav-inner{
  display:grid;
  grid-template-columns:repeat(6,1fr);
}

.mobile-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:6px 2px;
  font-size:10px;
  border-radius:11px;
}

.mobile-btn span{
  display:block;
  font-size:18px;
  margin-bottom:3px;
}

.mobile-btn.active{
  color:var(--primary);
  background:rgba(37,99,235,.08);
  font-weight:900;
}

/* HIDDEN */
.hidden{
  display:none!important;
}

/* EMPTY */
.empty{
  text-align:center;
  padding:40px 15px;
  color:var(--muted);
}

/* RESPONSIVE */
@media(max-width:900px){
  .desktop-nav{
    display:none;
  }

  .mobile-nav{
    display:block;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hero-box{
    padding:35px 25px;
  }
}

@media(max-width:600px){
  :root{
    --header:64px;
  }

  .container{
    width:min(100% - 20px,1180px);
  }

  .brand-title{
    font-size:14px;
  }

  .brand-sub{
    font-size:9px;
  }

  .logo{
    width:39px;
    height:39px;
  }

  .header-actions .lang-text{
    display:none;
  }

  .stats{
    gap:9px;
  }

  .stat{
    padding:15px;
  }

  .stat-number{
    font-size:21px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .hero{
    padding-top:20px;
  }

  .hero-box{
    border-radius:22px;
    padding:28px 20px;
  }

  .hero h1{
    font-size:31px;
  }

  .hero p{
    font-size:14px;
  }

  .section-title{
    font-size:21px;
  }

  .card{
    padding:17px;
  }

  footer{
    padding-bottom:105px;
  }

  .toast{
    left:15px;
    right:15px;
    bottom:78px;
  }
}
</style>
</head>

<main id="app"></main>

<footer>

</footer>

<div class="mobile-nav">
  <div class="mobile-nav-inner">
    <button class="mobile-btn active" data-view="home">
      <span>⌂</span><span data-i18n="home">الرئيسية</span>

    <button class="mobile-btn" data-view="academy">

    <button class="mobile-btn" data-view="library">

    <button class="mobile-btn" data-view="games">
      <span>🎮</span><span data-i18n="games">الألعاب</span>

    <button class="mobile-btn" data-view="progress">
      <span>🏆</span><span data-i18n="progress">تقدمي</span>

  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="close" id="modalClose">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

let challengeIndex = 0;
let challengeScore = 0;
let gameTarget = null;

function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return {...defaultState(),...(saved || {})};
  }catch(e){
    return defaultState();
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}

function lang(){
  return state.language || "ar";
}

function t(key){
  return translations[lang()][key] || translations.ar[key] || key;
}

function localized(obj){
  if(!obj) return "";
  return obj[lang()] || obj.ar || obj.en || "";
}

/* =========================================================
   THEME
========================================================= */

function applyTheme(){
  const dark = state.theme === "dark";

  document.documentElement.classList.toggle("dark",dark);

  const btn = document.getElementById("themeToggle");

  if(btn){
    btn.textContent = dark ? "☀️" : "🌙";
    btn.title = dark
      ? (lang()==="ar" ? "الوضع النهاري" : lang()==="fr" ? "Mode clair" : "Light mode")
      : (lang()==="ar" ? "الوضع الليلي" : lang()==="fr" ? "Mode sombre" : "Dark mode");
  }

  document.querySelector('meta[name="theme-color"]')
    ?.setAttribute("content",dark ? "#0b1120" : "#2563eb");
}

function toggleTheme(){
  state.theme = state.theme === "dark" ? "light" : "dark";
  saveState();
  applyTheme();
  showToast(
    state.theme==="dark"

      : (lang()==="ar" ? "تم تفعيل الوضع النهاري ☀️" : lang()==="fr" ? "Mode clair activé ☀️" : "Light mode enabled ☀️")

/* =========================================================
   LANGUAGE
========================================================= */

function applyLanguage(){
  document.documentElement.lang = lang();
  document.documentElement.dir = lang()==="en" || lang()==="fr" ? "ltr" : "rtl";

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.dataset.i18n;
    if(translations[lang()][key]){
      el.textContent = translations[lang()][key];
    }
  });

  const languageText = document.querySelector(".lang-text");

  if(languageText){
    languageText.textContent =
      lang()==="ar" ? "العربية" :
      lang()==="fr" ? "Français" : "English";
  }

  applyTheme();
}

function setLanguage(language){
  if(!translations[language]) return;

  state.language = language;
  saveState();

  document.getElementById("languageMenu")?.classList.remove("show");

  applyLanguage();
  render();
}

/* =========================================================
   XP / PROGRESS
========================================================= */

function addXP(amount){
  state.xp += amount;
  saveState();
  updateStats();
}

function level(){
  return Math.floor(state.xp / 100) + 1;
}

function levelProgress(){
  return state.xp % 100;
}

function updateStreak(){
  const today = new Date().toLocaleDateString("en-CA");

  if(state.lastDate === today) return;

  if(state.lastDate){
    const previous = new Date(state.lastDate);
    const current = new Date(today);
    const diff = Math.round((current-previous)/86400000);

    if(diff===1){
      state.streak++;
    }else if(diff>1){
      state.streak=1;
    }
  }else{
    state.streak=1;
  }

  state.lastDate=today;
  saveState();
}

/* =========================================================

========================================================= */

function navigate(view){
  const valid = ["home","academy","library","challenges","games","progress"];

  if(!valid.includes(view)) view="home";

  currentView=view;

  document.querySelectorAll("[data-view]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.view===view);
  });

  render();

  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("click",function(e){

  const nav = e.target.closest("[data-view]");

  if(nav){
    e.preventDefault();
    navigate(nav.dataset.view);
    return;
  }

  const language = e.target.closest("[data-language]");

  if(language){
    setLanguage(language.dataset.language);
    return;
  }

});

function startChallenge(id){

  const challenge=challenges.find(c=>c.id===id);

  if(!challenge) return;

  currentChallenge=id;
  challengeIndex=0;
  challengeScore=0;

  showChallengeQuestion();
}

function showChallengeQuestion(){

  const challenge=challenges.find(c=>c.id===currentChallenge);

  if(!challenge) return;

  const q=challenge.questions[challengeIndex];

  if(!q){
    finishChallenge();
    return;
  }

  openModal(
    localized(challenge.title),
    `
      <div style="margin-bottom:12px;color:var(--muted)">
        ${t("question")} ${challengeIndex+1}/${challenge.questions.length}
      </div>

      <div class="question">
        ${localized(q.question)}
      </div>

      <div class="options">
        ${q.options.map((option,index)=>`
          <button
            class="option"
            onclick="answerChallenge(${index})">
            ${option}
          </button>
        `).join("")}
      </div>
    `
  );
}

function answerChallenge(index){

  const challenge=challenges.find(c=>c.id===currentChallenge);

  if(!challenge) return;

  const q=challenge.questions[challengeIndex];

  if(index===q.answer){
    challengeScore++;
    state.correct++;
    addXP(20);
    showToast(t("correct"));
  }else{
    showToast(t("wrong"));
  }

  challengeIndex++;

  setTimeout(showChallengeQuestion,500);
}

function finishChallenge(){

  state.challenges++;

  const bonus=challengeScore*10;

  addXP(bonus);
  saveState();

  openModal(
    t("score"),
    `
      <div style="text-align:center;padding:20px">

        <div style="font-size:55px">🏆</div>

        <h2>
          ${challengeScore}
          /
          ${challenges.find(c=>c.id===currentChallenge)?.questions.length || 0}
        </h2>

        <p>+${bonus} XP</p>

        <button class="btn btn-blue" onclick="closeModal()">
          ${t("finish")}
        </button>

      </div>
    `
  );
}

/* =========================================================
   MODAL
========================================================= */

function openModal(title,content){

  const modal=document.getElementById("modal");

  if(!modal) return;

  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalContent").innerHTML=content;

  modal.classList.add("show");
  document.body.style.overflow="hidden";
}

function closeModal(){

  document.getElementById("modal")?.classList.remove("show");
  document.body.style.overflow="";
}

document.getElementById("modalClose").addEventListener("click",closeModal);

document.getElementById("modal").addEventListener("click",function(e){
  if(e.target===this){
    closeModal();
  }
});

/* =========================================================
   TOAST
========================================================= */

let toastTimer=null;

function showToast(message){

  const toast=document.getElementById("toast");

  if(!toast) return;

  toast.textContent=message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    toast.classList.remove("show");
  },2300);
}

    !e.target.closest(".language-box")
  ){
    menu.classList.remove("show");
  }

});

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",function(e){

  if(e.key==="Escape"){
    closeModal();

    document.getElementById("languageMenu")
      ?.classList.remove("show");
  }

});

/* =========================================================
   INITIALIZATION
========================================================= */

(function init(){

  applyLanguage();
  applyTheme();
  render();

})();

</script>

</body>
</html>
